<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testimonios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-light p-4">
    <div class="container">
        <h2 class="h3 fw-bold text-center mb-4">Lo que dicen nuestros estudiantes</h2>
        <div class="row g-4">
            <div class="col-12 col-md-6">
                <figure class="p-4 bg-white border-start border-4 border-primary rounded shadow-sm h-100">
                    <blockquote class="blockquote">
                        <p class="fs-5 fw-medium mb-3">Gracias a la metodología Mobile First pude lanzar mi primera aplicación web en menos de tres meses.</p>
                    </blockquote>
                    <figcaption class="blockquote-footer mb-0">
                        Mariana Silva en <cite title="Tech Startups">Tech Startups</cite>
                    </figcaption>
                </figure>
            </div>
            <div class="col-12 col-md-6">
                <figure class="p-4 bg-white border-start border-4 border-success rounded shadow-sm h-100">
                    <blockquote class="blockquote">
                        <p class="fs-5 fw-medium mb-3">Aprender a usar los 3 métodos de conexión me dio la flexibilidad que necesitaba para mis clientes.</p>
                    </blockquote>
                    <figcaption class="blockquote-footer mb-0">
                        David López en <cite title="DevStudio">DevStudio</cite>
                    </figcaption>
                </figure>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>   
</body>
</html>
